
server:
  port: 8080

spring:
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: event-service-route
              uri: lb://event-service
              predicates:
                - Path=/api/events/**
            - id: order-service-route
              uri: lb://order-service
              predicates:
                - Path=/api/orders/**
